# nginx server block for food.fherrmann.com (calorie counter).
#
# Installed by deploy/setup-food.sh. Manually:
#   sudo cp deploy/nginx-food.fherrmann.com.conf /etc/nginx/sites-available/food.fherrmann.com
#   sudo ln -s /etc/nginx/sites-available/food.fherrmann.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# The :443 block below needs the certificate to exist already. Before that,
# only the :80 block may be enabled, so certbot can answer the webroot
# challenge:
#   sudo mkdir -p /var/www/food.fherrmann.com
#   sudo certbot certonly --webroot -w /var/www/food.fherrmann.com -d food.fherrmann.com

server {
    listen 80;
    listen [::]:80;
    server_name food.fherrmann.com;

    # Hierueber erneuert certbot das Zertifikat - der Renewal-Lauf bringt
    # natuerlich keinen Token mit, deshalb ohne jede Pruefung.
    location /.well-known/acme-challenge/ {
        root /var/www/food.fherrmann.com;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name food.fherrmann.com;

    ssl_certificate     /etc/letsencrypt/live/food.fherrmann.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/food.fherrmann.com/privkey.pem;

    # ---- Kein Privat-Gate mehr (seit 2026-09) -------------------------------
    # Bis dahin hing die ganze Domain hinter dem Privat-Cookie von fherrmann.com
    # ($fh_private). Seit es persoenliche Healthy-Token gibt (Torben, die
    # Android-App), kann nginx gueltige von ungueltigen Zugaengen nicht mehr
    # unterscheiden - ein Gate hier sperrte genau die aus, fuer die es sie gibt.
    # Die App prueft jeden Zugang selbst (SecurityConfig: Privat-Cookie,
    # health_token-Cookie, Bearer) und antwortet ohne gueltigen mit 403 - wie
    # die Einkaufsliste unter fherrmann.com/shopping-list.
    # ------------------------------------------------------------------------

    location / {
        proxy_pass http://127.0.0.1:48180;

        # Die Schnellerfassung schickt Fotos als Base64 im JSON (~300 kB, die
        # App verkleinert vorher); die nginx-Vorgabe von 1 MB waere knapp.
        # Die Android-App laedt hier nur herunter, das begrenzt diese Zeile nicht.
        client_max_body_size 8m;

        # Reserve, kein Muss mehr: die Schnellerfassung laeuft seit dem Umbau
        # als Hintergrundauftrag, jede einzelne Anfrage ist also kurz. Vorher
        # hing sie bis zu einer Minute am Draht und lief in die nginx-Vorgabe von
        # 60 s - und weil hier HTTP/2 laeuft, kam dabei kein 504 an, sondern ein
        # zurueckgesetzter Stream. Im Browser sah das als "Failed to fetch" aus,
        # ohne dass irgendwo ein Fehlerstatus auftauchte. Der grosszuegige Wert
        # bleibt, damit dieselbe stumme Falle nicht bei der naechsten laengeren
        # Antwort wieder zuschnappt.
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
