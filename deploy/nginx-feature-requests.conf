      # Feature Requests - ein Pfad unter fherrmann.com, bedient vom
      # Kalorienzaehler (food, :48180). Eingesetzt von
      # deploy/setup-feature-requests.sh direkt vor dem /grades/-Block.
      #
      # KEIN Privat-Gate: Torben hat keinen fh_private-Cookie, sondern seinen
      # persoenlichen health_token (Domain=fherrmann.com). Der Dienst prueft
      # jeden Zugang selbst und antwortet ohne gueltigen mit 403 - wie auf
      # food.fherrmann.com und bei der Einkaufsliste.
      #
      # proxy_pass ohne Pfad: die Adresse kommt samt /feature-requests/ beim
      # Dienst an, der genau dort seine Seite und Schnittstelle hat.
      location /feature-requests/ {
          proxy_pass http://127.0.0.1:48180;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_redirect off;
      }

