spring.application.name=Food

# Path to the single source of truth (targets, dish library and diary entries).
# Relative paths are resolved from the working directory the app is started in.
food.data-file=data/food.json

# --- Networking -------------------------------------------------------------
# Internal, non-standard port. Meant to sit behind a reverse proxy (nginx) that
# terminates TLS; the app itself only listens on localhost so it is never
# directly reachable from outside.
server.port=48180
server.address=127.0.0.1

# Trust the X-Forwarded-Proto header nginx sets, so the app sees the real,
# internet-facing scheme rather than the plain-HTTP hop from nginx to the app.
server.forward-headers-strategy=framework

# Die Begruendung eines Fehlers mitschicken ("Erst ein Gewicht eintragen.",
# "Die Anteile muessen zusammen 100 % ergeben ..."). Spring laesst sie per
# Vorgabe weg - dann sahen alle Oberflaechen nur "Bad Request" statt des Satzes,
# der hier fuer genau diesen Fall formuliert ist. Seit Spring Boot 4 unter
# spring.web.error; das alte server.error.include-message wirkt nicht mehr.
spring.web.error.include-message=always

# --- Auth -------------------------------------------------------------------
# The shared "private mode" token of fherrmann.com. It is NOT owned by this app:
# it lives in /etc/nginx/conf.d/private-mode.conf and is handed out once per
# device via https://fherrmann.com/setup?token=<secret>, which sets the cookie
# on Domain=.fherrmann.com - so it covers food.fherrmann.com too. nginx already
# refuses requests without it; checking it here as well means the app is not
# defenceless if it is ever reached without passing through that server block.
# The default below is for local development only - ALWAYS override via the
# FH_PRIVATE_TOKEN environment variable in any non-local deployment.
food.security.token=${FH_PRIVATE_TOKEN:changeme-local-token}

# --- Mehrere Personen (seit 2026-09) ------------------------------------------
# Der Privat-Cookie oben meint weiterhin genau eine Person: die Eigentuemerin.
# Ihre Dateien bleiben unter data/ liegen, wie sie sind.
health.owner=${HEALTH_OWNER:felix}
# Weitere Personen mit eigenem Token: name:token,name:token. Derselbe Wert steht
# in /etc/health-viz.env - ein Token oeffnet Kalorienzaehler und Weight Tracker.
# Jede Person sieht nur ihr eigenes Tagebuch, abgelegt unter data/users/<name>/.
# Leer = nur die Eigentuemerin, also genau das Verhalten von vorher.
health.tokens=${HEALTH_TOKENS:}
# Auf welche Domain das Cookie eines Setup-Links gesetzt wird: auf die ganze,
# damit derselbe Link auch weight.fherrmann.com oeffnet. Lokal wird sie
# weggelassen, weil der Browser sie dort verwerfen wuerde (siehe HealthCookie).
health.cookie-domain=${HEALTH_COOKIE_DOMAIN:fherrmann.com}

# Wer die ganze Naehrwerttabelle erfasst (gesaettigte Fettsaeuren, Zucker,
# Ballaststoffe, Salz) statt nur kcal und der drei Makros. Namen mit Komma,
# * = alle, leer = niemand. Die Oberflaechen fragen das ueber /features ab.
food.detailed-people=${FOOD_DETAILED_NUTRIENTS:}

# --- Schnellerfassung (Claude-Code-Session) ---------------------------------
# Freitext rein, fertiger Eintrag raus. Ausgewertet wird nicht ueber die API,
# sondern durch eine Claude-Code-Session auf dem Server - dieselbe Bauart wie der
# taegliche Lauf des Finance Cockpits: das Wrapper-Skript startet `claude -p` in
# einem Arbeitsverzeichnis, in dem CLAUDE.md den Fachkontext und
# .claude/settings.json die Rechte festlegt. Beides liegt bewusst NICHT im Repo,
# damit der Agent seine eigenen Leitplanken nicht anfassen kann.
#
# Leer = Funktion aus. Die App startet dann normal, die Oberflaeche fragt das
# ueber /api/food/features ab und blendet den Knopf gar nicht erst ein.
food.agent.command=
# Wer sie benutzen darf: jede Auswertung laeuft auf Felix' Claude-Login und
# zaehlt auf sein Kontingent. Namen mit Komma, * = alle mit Token. Leer = nur
# die Eigentuemerin, wie vorher.
food.agent.people=${FOOD_QUICK_CAPTURE:}
# Eine Session, die Naehrwerte nachschlaegt, braucht deutlich laenger als
# eine, die nur schaetzt - gemessen wurden bis zu 56 s.
food.agent.timeout-seconds=180
# Wohin ein Foto aus der App fuer die Dauer der Auswertung gelegt wird. Unter
# data/, weil der Dienst nur dort schreiben darf (systemd); der Agent hat genau
# fuer diesen Ordner Leserecht (deploy/agent/.claude/settings.json). Relativ zum
# Arbeitsverzeichnis, also /opt/food/data/inbox.
food.agent.inbox=${FOOD_AGENT_INBOX:data/inbox}

# Origins allowed to read the small cross-site endpoints (/api/food/daily for
# the kcal overlay in the weight tracker's charts, /api/food/status for the
# statusboard card). Both are other subdomains of fherrmann.com, so the browser
# still sends the private-mode cookie (SameSite=Lax covers same-site requests);
# CORS is only needed because the *origin* differs.
food.cors.allowed-origins=https://weight.fherrmann.com,https://status.fherrmann.com

# --- Push-Benachrichtigungen ------------------------------------------------
# Meldet dem Handy, dass eine Schnellerfassung fertig ist. Ohne Schluessel
# passiert nichts - die Funktion faellt dann einfach weg, die Auswertung selbst
# laeuft unabhaengig davon.
#
# Der Schluessel ist eine .p8-Datei aus dem Apple-Developer-Portal. Sie gehoert
# NICHT ins Repo: Pfad ueber /etc/food.env setzen, Datei chmod 600.
food.push.key-file=${APNS_KEY_FILE:}
food.push.key-id=${APNS_KEY_ID:}
food.push.team-id=${APNS_TEAM_ID:}
food.push.topic=${APNS_TOPIC:com.fherrmann.cockpit}

# Sandbox oder Produktion entscheidet die Signatur der App, nicht der Server:
# eine Entwicklungssignatur liefert Kennungen, die nur die Sandbox kennt. Wer
# hier den Produktionshost eintraegt und die App aus Xcode installiert, bekommt
# BadDeviceToken und sonst nichts.
food.push.host=${APNS_HOST:https://api.sandbox.push.apple.com}

# Die angemeldeten Geraete. Bewusst neben food.json und nicht darin:
# Kennungen sind fluechtig, das Tagebuch ist es nicht.
food.push.devices-file=${FOOD_DEVICES_FILE:data/devices.json}

# Android-Geraete (Firebase) getrennt von den iOS-Kennungen, je Person.
food.push.android-devices-file=${FOOD_ANDROID_DEVICES_FILE:data/devices-android.json}

# --- Push an Android (Firebase Cloud Messaging) -----------------------------
# Die JSON-Datei eines Dienstkontos aus der Firebase-Konsole (Projekteinstellungen
# / Dienstkonten / Neuen privaten Schluessel generieren). Gehoert NICHT ins Repo:
# /etc/fcm-healthy.json, root:food 640. Leer = keine Android-Benachrichtigungen.
food.fcm.service-account-file=${FCM_SERVICE_ACCOUNT_FILE:}
food.fcm.endpoint=https://fcm.googleapis.com

# --- Android-App zum Herunterladen -------------------------------------------
# Verzeichnis mit healthy.apk und latest.json, gefuellt vom Veroeffentlichungs-
# Skript im Repo healthy-android. Der Dienst liest es nur. Leer = keine App.
food.android.dir=${FOOD_ANDROID_DIR:}
# Welche Version zuletzt per Push angekuendigt wurde.
food.android.announced-file=${FOOD_ANDROID_ANNOUNCED_FILE:data/android-release.json}
